<desc style="fill:rgb(0, 0, 0);stroke:none;color:rgb(11, 11, 11);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:anthropic-sans, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto">Schematic of the 23-exon BUB1B gene structure and the BUB1B protein with its three functional domains, marking two confirmed variants from VEP annotation: a stop-gained variant in exon 17 (p.Leu737Ter) and a missense variant in exon 23 (p.Asn1002Lys), both within or adjacent to the PKc-like kinase domain.</desc>
