<svg width="100%" viewBox="0 0 680 340" role="img" xmlns="http://www.w3.org/2000/svg">
<title>BUB1B gene and protein diagram with two confirmed variant positions</title>
<desc>Schematic of the 23-exon BUB1B gene structure and the BUB1B protein with its three functional domains, marking two confirmed variants: p.Leu737* in exon 17 and p.Asn1002Lys in exon 23.</desc>

<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>

<!-- Solid White Background for crisp display across all themes -->
<rect width="680" height="340" fill="#ffffff" rx="8"/>

<!-- Exon 17 Callout at Top -->
<line x1="471" y1="46" x2="471" y2="88" stroke="rgb(137, 135, 129)" stroke-width="1" stroke-dasharray="3, 3"/>
<rect x="440" y="22" width="62" height="22" rx="4" fill="#fee2e2" stroke="#ef4444" stroke-width="1"/>
<text x="471" y="37" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif" font-size="12px" font-weight="600" fill="#b91c1c">Exon 17</text>

<!-- Exon 23 Callout at Top -->
<line x1="620" y1="46" x2="620" y2="88" stroke="rgb(137, 135, 129)" stroke-width="1" stroke-dasharray="3, 3"/>
<rect x="589" y="22" width="62" height="22" rx="4" fill="#fef3c7" stroke="#f59e0b" stroke-width="1"/>
<text x="620" y="37" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif" font-size="12px" font-weight="600" fill="#b45309">Exon 23</text>

<!-- Top Horizontal Bar: BUB1B Gene Model (23 Exons) -->
<!-- Track background container -->
<rect x="52" y="90" width="580" height="28" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>

<!-- Intron backbone line running through exons -->
<line x1="58" y1="104" x2="626" y2="104" stroke="#94a3b8" stroke-width="2"/>

<!-- 23 Exon Blocks -->
<g id="exons">
  <rect x="55.5" y="93" width="13" height="22" rx="2" fill="#bfdbfe" stroke="#2563eb" stroke-width="1.0"/>
  <rect x="81.1" y="93" width="13" height="22" rx="2" fill="#bfdbfe" stroke="#2563eb" stroke-width="1.0"/>
  <rect x="106.6" y="93" width="13" height="22" rx="2" fill="#bfdbfe" stroke="#2563eb" stroke-width="1.0"/>
  <rect x="132.2" y="93" width="13" height="22" rx="2" fill="#bfdbfe" stroke="#2563eb" stroke-width="1.0"/>
  <rect x="157.8" y="93" width="13" height="22" rx="2" fill="#bfdbfe" stroke="#2563eb" stroke-width="1.0"/>
  <rect x="183.3" y="93" width="13" height="22" rx="2" fill="#bfdbfe" stroke="#2563eb" stroke-width="1.0"/>
  <rect x="208.9" y="93" width="13" height="22" rx="2" fill="#bfdbfe" stroke="#2563eb" stroke-width="1.0"/>
  <rect x="234.4" y="93" width="13" height="22" rx="2" fill="#bfdbfe" stroke="#2563eb" stroke-width="1.0"/>
  <rect x="260.0" y="93" width="13" height="22" rx="2" fill="#bfdbfe" stroke="#2563eb" stroke-width="1.0"/>
  <rect x="285.6" y="93" width="13" height="22" rx="2" fill="#bfdbfe" stroke="#2563eb" stroke-width="1.0"/>
  <rect x="311.1" y="93" width="13" height="22" rx="2" fill="#bfdbfe" stroke="#2563eb" stroke-width="1.0"/>
  <rect x="336.7" y="93" width="13" height="22" rx="2" fill="#bfdbfe" stroke="#2563eb" stroke-width="1.0"/>
  <rect x="362.2" y="93" width="13" height="22" rx="2" fill="#bfdbfe" stroke="#2563eb" stroke-width="1.0"/>
  <rect x="387.8" y="93" width="13" height="22" rx="2" fill="#bfdbfe" stroke="#2563eb" stroke-width="1.0"/>
  <rect x="413.4" y="93" width="13" height="22" rx="2" fill="#bfdbfe" stroke="#2563eb" stroke-width="1.0"/>
  <rect x="438.9" y="93" width="13" height="22" rx="2" fill="#bfdbfe" stroke="#2563eb" stroke-width="1.0"/>
  <rect x="464.5" y="93" width="13" height="22" rx="2" fill="#fca5a5" stroke="#dc2626" stroke-width="1.5"/>
  <rect x="489.3" y="93" width="13" height="22" rx="2" fill="#bfdbfe" stroke="#2563eb" stroke-width="1.0"/>
  <rect x="514.2" y="93" width="13" height="22" rx="2" fill="#bfdbfe" stroke="#2563eb" stroke-width="1.0"/>
  <rect x="539.0" y="93" width="13" height="22" rx="2" fill="#bfdbfe" stroke="#2563eb" stroke-width="1.0"/>
  <rect x="563.8" y="93" width="13" height="22" rx="2" fill="#bfdbfe" stroke="#2563eb" stroke-width="1.0"/>
  <rect x="588.7" y="93" width="13" height="22" rx="2" fill="#bfdbfe" stroke="#2563eb" stroke-width="1.0"/>
  <rect x="613.5" y="93" width="13" height="22" rx="2" fill="#fde047" stroke="#d97706" stroke-width="1.5"/>
</g>

<!-- Gene Track Labels below bar -->
<g id="exon-labels" font-family="-apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif" font-size="11px">
  <text x="62.0" y="132" text-anchor="middle" font-weight="500" fill="#64748b">Ex1</text>
  <text x="164.2" y="132" text-anchor="middle" font-weight="500" fill="#64748b">Ex5</text>
  <text x="292.1" y="132" text-anchor="middle" font-weight="500" fill="#64748b">Ex10</text>
  <text x="419.9" y="132" text-anchor="middle" font-weight="500" fill="#64748b">Ex15</text>
  <text x="471.0" y="132" text-anchor="middle" font-weight="700" fill="#dc2626">Ex17</text>
  <text x="545.5" y="132" text-anchor="middle" font-weight="500" fill="#64748b">Ex20</text>
  <text x="620.0" y="132" text-anchor="middle" font-weight="700" fill="#d97706">Ex23</text>
</g>

<!-- Diagonal Connecting Guidelines from Exons to Protein Residues -->
<line x1="471" y1="120" x2="453" y2="175" stroke="#dc2626" stroke-width="1.2" stroke-dasharray="3, 3"/>
<line x1="620" y1="120" x2="594" y2="175" stroke="#d97706" stroke-width="1.2" stroke-dasharray="3, 3"/>

<!-- Protein Variant Labels & Markers (above protein bar) -->
<!-- p.Leu737* (Exon 17) -->
<text x="453" y="174" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif" font-size="12px" fill="#64748b">stop-gained</text>
<text x="453" y="190" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif" font-size="14px" font-weight="700" fill="#b91c1c">p.Leu737*</text>
<line x1="453" y1="195" x2="453" y2="230" stroke="#dc2626" stroke-width="2"/>
<circle cx="453" cy="197" r="3.5" fill="#dc2626"/>

<!-- p.Asn1002Lys (Exon 23) -->
<text x="594" y="174" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif" font-size="12px" fill="#64748b">missense</text>
<text x="594" y="190" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif" font-size="14px" font-weight="700" fill="#b45309">p.Asn1002Lys</text>
<line x1="594" y1="195" x2="594" y2="230" stroke="#d97706" stroke-width="2"/>
<circle cx="594" cy="197" r="3.5" fill="#d97706"/>

<!-- Bottom Horizontal Bar: BUBR1 Protein Track (aa 1 to 1050) -->
<!-- Protein backbone -->
<rect x="60" y="230" width="560" height="28" rx="4" fill="rgb(241, 239, 232)" stroke="rgb(148, 163, 184)" stroke-width="1"/>

<!-- Functional Domains -->
<!-- Mad3_BUB1_I domain -->
<rect x="90" y="230" width="65" height="28" rx="4" fill="rgb(225, 245, 238)" stroke="rgb(15, 110, 86)" stroke-width="1"/>

<!-- PTZ00121 / GLEBS domain -->
<rect x="257" y="230" width="63" height="28" rx="4" fill="rgb(234, 243, 222)" stroke="rgb(59, 109, 17)" stroke-width="1"/>

<!-- PKc-like Kinase Domain (750 - 1045) -->
<rect x="460" y="230" width="157" height="28" rx="4" fill="rgb(254, 243, 199)" stroke="rgb(217, 119, 6)" stroke-width="1.2"/>

<!-- Domain Text Labels -->
<g font-family="-apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif" font-size="12px">
  <text x="122" y="274" text-anchor="middle" fill="#065f46" font-weight="600">Mad3_BUB1_I</text>
  <text x="288" y="274" text-anchor="middle" fill="#3f6212" font-weight="600">PTZ00121</text>
  <text x="538" y="274" text-anchor="middle" fill="#92400e" font-weight="700">PKc-like</text>
</g>

<!-- Protein Scale Coordinates -->
<g font-family="-apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif" font-size="12px" fill="#64748b">
  <text x="60" y="298" text-anchor="start">aa 1</text>
  <text x="617" y="298" text-anchor="end">aa 1050</text>
</g>

</svg>